<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ippon</title>
    <!-- 画面サイズ適応-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS読み込み-->
    <link rel="stylesheet" href="css/result.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DotGothic16&family=Righteous&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
    	<!-- <video class="video" id="video" autoplay playsinline></video> -->
        <div class="outer-circle">
            <div id="display-text" class="centered-text"></div> <!-- 文字列を表示する要素を追加 -->
        </div>
        <div class="circle-1 circle"></div>
        <div class="circle-2 circle"></div>
        <div class="circle-3 circle"></div>
        <div class="circle-4 circle"></div>
        <div class="circle-5 circle"></div>
        <div class="circle-6 circle"></div>
        <div class="circle-7 circle"></div>
        <div class="circle-8 circle"></div>
        <div class="circle-9 circle"></div>
        <div class="circle-10 circle"></div>
        <div class="point"></div>
    </div>

    <button id="confirm-button">確定</button>

    <!-- お題入力の開閉トグル（普段は入力欄を隠しておく） -->
    <button id="topic-toggle" type="button" aria-label="お題を入力">✏️ お題を入力</button>

    <form id="text-form">
        <input type="text" id="text-input" placeholder="ここに文字を入力してください" />
        <button type="submit">送信</button>
    </form>

    <script src="js/result.js"></script>
    <script>
      // お題入力欄の開閉制御（result.js の送信処理には手を加えない）
      (function () {
        var toggle = document.getElementById('topic-toggle');
        var form = document.getElementById('text-form');
        var input = document.getElementById('text-input');
        function open() {
          document.body.classList.add('topic-open');
          toggle.setAttribute('aria-expanded', 'true');
          if (input) input.focus();
        }
        function close() {
          document.body.classList.remove('topic-open');
          toggle.setAttribute('aria-expanded', 'false');
        }
        toggle.addEventListener('click', function () {
          if (document.body.classList.contains('topic-open')) close();
          else open();
        });
        // 送信したら自動で閉じる
        if (form) form.addEventListener('submit', close);
        // Escで閉じる
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') close();
        });
      })();
    </script>
</body>
</html>
